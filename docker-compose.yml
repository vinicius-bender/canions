version: '3.8'

services:
  web:
    build: .
    command: gunicorn canionsDoSul_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./:/canionsDoSul
      - static_volume:/canionsDoSul/staticfiles
      - media_volume:/canionsDoSul/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    restart: unless-stopped
  
  db:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=canions_pass
      - POSTGRES_USER=canions_user
      - POSTGRES_DB=canions_db
    ports:
      - "5432:5432"
    restart: unless-stopped
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
