services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn canionsDoSul_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/canionsDoSul
      - static_volume:/canionsDoSul/staticfiles
      - media_volume:/canionsDoSul/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/deploy/projetos/canionsDoSul/staticfiles
      o: bind
  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/deploy/projetos/canionsDoSul/media
      o: bind

