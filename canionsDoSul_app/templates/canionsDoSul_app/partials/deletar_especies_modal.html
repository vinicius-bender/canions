<div class="modal-body">
  <div class="modal-header">
    <div class="btn-fechar-modal-div">
      <h2 class="modal-title">Confirmar Exclusão</h2>
      <button class="btn-fechar-modal" aria-label="Fechar modal">×</button>
    </div>
  </div>
  <p>Tem certeza que deseja excluir a espécie <strong>{{ species.popular_name }}</strong>?</p>
  <form id="delete-form">
    {% csrf_token %}
    <div class="buttons-div">
      <button type="submit" class="reject-btn">Excluir</button>
      <button type="button" class="close-btn btn-fechar-modal">Cancelar</button>
    </div>
  </form>
</div>
