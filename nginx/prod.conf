server {
    listen 80;
    server_name 31.220.102.180;

    location /static/ {
        alias /canions/staticfiles/;
    }

    location /media/ {
        alias /canions/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
