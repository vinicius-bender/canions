services:
  web:
    build: .
    command: gunicorn canionsDoSul_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/canions/staticfiles
      - media_volume:/canions/media
    expose:
      - 8000
    env_file:
      - .env.prod
    depends_on:
      - db

  db:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
    - .env.prod

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - static_volume:/canions/staticfiles
      - media_volume:/canions/media
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'while true; do sleep 3600; done'"

volumes:
  postgres_data:
  static_volume:
  media_volume:

